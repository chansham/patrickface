name: Apple build validation

'on':
  push:
    branches:
      - main
      - codex/apple-watch-integration
      - 'wip/**'
      - 'cursor/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    branches:
      - main
      - codex/apple-watch-integration
      - 'wip/**'
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      unsigned_device_archive:
        description: Also build and inspect an unsigned iPhone + Watch device archive (not installable)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Read repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Xcode 26.6
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcode-select -p
          xcodebuild -version
          xcodebuild -version | grep -F 'Xcode 26.6'
      - name: Check measurement evidence for the three reviewed animation revisions
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/patrick-ci-logs"
          set -o pipefail
          node --test tools/test_animation_acceptance.mjs 2>&1 | tee "$RUNNER_TEMP/patrick-ci-logs/animation-evidence-tests.log"
          node tools/check_animation_acceptance.mjs \
            --audit animation/production-20261007-completion/body-scale-audit.json \
            --clip-ids chef-cookie-repair-20261007,focus-transition-repair-20261007,charging-cozy-20261007 \
            | tee "$RUNNER_TEMP/patrick-ci-logs/animation-evidence.json"
      - name: Build unsigned Apple simulator apps
        id: simulator
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/patrick-ci-logs"
          set -o pipefail
          bash tools/build_apple_simulators.sh 2>&1 | tee "$RUNNER_TEMP/patrick-ci-logs/simulator.log"
      - name: Inspect unsigned device archive
        id: archive
        if: ${{ github.event_name == 'push' || inputs.unsigned_device_archive }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/test_archive_unsigned.py 2>&1 | tee "$RUNNER_TEMP/patrick-ci-logs/package-tests.log"
          python3 tools/archive_apple.py --package-unsigned --build-number "$GITHUB_RUN_NUMBER" --output "$RUNNER_TEMP/patrick-device-build" 2>&1 | tee "$RUNNER_TEMP/patrick-ci-logs/archive.log"
      - name: Capture native simulator screens
        if: ${{ always() && steps.simulator.outcome == 'success' }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/capture_apple_simulators.py \
            --phone-app "$PATRICK_PHONE_SIM_APP" \
            --watch-app "$PATRICK_WATCH_SIM_APP" \
            --phone-udid "$PATRICK_TEST_PHONE_UDID" \
            --layouts classic bold theater activity \
            --watch-geometry \
            --output "$RUNNER_TEMP/patrick-ci-logs/native-screens" \
            2>&1 | tee "$RUNNER_TEMP/patrick-ci-logs/capture.log"
      - name: Keep private build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-build-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/patrick-ci-logs/*.log
            ${{ runner.temp }}/patrick-ci-logs/*.json
            ${{ runner.temp }}/patrick-ci-logs/*.xcresult
            ${{ runner.temp }}/patrick-ci-logs/native-screens/
          retention-days: 7
          if-no-files-found: warn
      - name: Keep private unsigned package for Windows re-signing trial
        if: ${{ always() && steps.archive.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: patrick-unsigned-resigning-input-${{ github.run_number }}
          path: ${{ runner.temp }}/patrick-device-build/Unsigned/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
