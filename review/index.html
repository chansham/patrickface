<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>派大星素材審稿</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./review.css"></head>
<body><main><header><div><a href="../preview/">← 回到派大星的日常</a><h1>每一個素材，都由你決定。</h1><p>畫風沒有定案。這裡把「檔案能用」和「你喜歡」分開記錄。</p></div><button id="export">匯出我的意見</button></header>
<div class="filters"><label>找素材<input id="search" type="search" placeholder="搜尋檔名，例如 body、arm、widget"></label><label>內容<select id="category"><option value="">全部內容</option></select></label><label>審稿進度<select id="filter"><option value="pending">待你確認</option><option value="liked">我喜歡的</option><option value="revise">要修改的</option><option value="rejected">我不喜歡的</option><option value="removed">已清理／替換</option><option value="all">全部，包括參考</option></select></label></div>
<p id="summary" role="status">正在讀取盤點…</p><p class="notice">意見儲存在這個瀏覽器，不會直接刪除檔案。匯出後可交給我接續處理；「喜歡」也不會自動批准整套畫風。</p>
<div id="grid" class="grid"></div><div class="pagination"><button id="previous">上一頁</button><span id="page"></span><button id="next">下一頁</button></div></main><script type="module" src="./review.js"></script></body></html>
